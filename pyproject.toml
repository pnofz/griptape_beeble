[project]
name = "griptape-nodes-library-beeble"
version = "0.1.0"
description = "Griptape Nodes library wrapping the Beeble SwitchX API for VFX pipeline use"
authors = [{ name = "Rodeo FX" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beeble_library"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.21.0",
    "pyright>=1.1.396",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["beeble_library", "tests"]
exclude = [".venv", "**/__pycache__", "spike"]
pythonVersion = "3.12"
